name: build

# 没有 Mac 也能打出 .app：GitHub 提供免费的 macOS 机器。
# 用法：把项目推到 GitHub → Actions → build → Run workflow → 跑完在页面底部下载 artifact。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 打包
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: BiliFish-windows
          path: dist/windows/大肥鱼.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple 芯片
            arch: arm64
          - runner: macos-13   # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查 Tk
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 打包
        run: python build.py

      - name: 压缩 .app（保留可执行权限）
        run: |
          cd dist/mac
          zip -ry "BiliFish-${{ matrix.arch }}.zip" "大肥鱼.app"

      - uses: actions/upload-artifact@v4
        with:
          name: BiliFish-macos-${{ matrix.arch }}
          path: dist/mac/BiliFish-${{ matrix.arch }}.zip
          if-no-files-found: error
